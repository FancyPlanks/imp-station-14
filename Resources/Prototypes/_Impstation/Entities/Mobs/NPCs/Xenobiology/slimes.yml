- type: entity
  name: grey slime
  parent: [SimpleMobBase, BaseMobSlime ] # Impstation - Animal Husbandry Rewrite
  id: MobBaseXenoSlime
  description: Gooey.
  components:
  - type: Sprite
    drawdepth: Mobs
    state: slime
    sprite: _Impstation/Mobs/Xenobiology/greyslime.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 250
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Tag
    tags:
    - DoorBumpOpener
    - Slime
    - VimPilot
    - FootstepSound
  - type: Grammar
    attributes:
      gender: epicene
  - type: ReplacementAccent
    accent: slimes
  - type: NpcFactionMember
    factions:
    - Passive
  - type: HTN
    rootTask:
      task: SlimeCompound
  - type: ExaminableHunger
  - type: GoobAbsorbable
    biomassRestored: 0.7
  - type: Carriable #DeltaV
  - type: AlwaysRevolutionaryConvertible
  - type: ImpReproductive
    hungerPerBirth: 50
    pregnancyLength: 20
    maxBreedDamage: 5
    sex: none
    breedPrototype: SlimeSettings
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 4
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSlime
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.2
    damageRecovery:
      types:
        Asphyxiation: -1.0
    maxSaturation: 15
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Slime
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Slime
        Quantity: 150
    bloodlossDamage:
      types:
        Bloodloss:
          0.5
    bloodlossHealDamage:
      types:
        Bloodloss:
          -0.25
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.45
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
    reactions:
    - reagents: [ Water, SpaceCleaner ]
      methods: [ Touch ]
      effects:
      - !type:WashCreamPie
    - reagents: [ Water ]
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: 0.05 #Same as slime species
      - !type:PopupMessage
        type: Local
        messages: [ "slime-hurt-by-water-popup" ]
        probability: 0.25
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
        path: /Audio/Weapons/punch3.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 6
        Structural: 4
        Caustic: 4
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-slimes
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
  - type: Speech
    speechVerb: Slime
    speechSounds: Slime
  - type: TypingIndicator
    proto: slime
  - type: NightVision # EE edit
    isActive: true
    toggleAction: null
    color: "#50595C"
    activateSound: null
    deactivateSound: null

- type: entity
  name: pink slime
  parent: MobBaseXenoSlime 
  id: MobPinkXenoSlime
  description: Gooey.
  components:
  - type: Sprite
    color: "#FF69B4"
  - type: Tag
    tags:
    - DoorBumpOpener
    - Slime
    - VimPilot
    - FootstepSound
    - SlimePink
  - type: ImpReproductive
    breedPrototype: PinkSlimeSettings

- type: entity
  name: frosted slime
  parent: MobBaseXenoSlime 
  id: MobIceXenoSlime
  description: Frosty to the touch.
  components:
  - type: Sprite
    sprite: _Impstation/Mobs/Xenobiology/iceslime.rsi
    layers: 
    - state: slime
      color: "#4cbdff"
    - state: ice
  - type: Tag
    tags:
    - DoorBumpOpener
    - Slime
    - VimPilot
    - FootstepSound
    - SlimeIce
  - type: ImpReproductive
    breedPrototype: IceSlimeSettings