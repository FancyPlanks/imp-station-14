# Large asteroids, typically 1
- type: dungeonConfig
  id: ExteriorMixed
  # Floor generation
  bounds: 400, 400
  overwritableTiles:
    - Lattice
  layers:

  - !type:NoiseDistanceDunGen
    #tileCap: 2000
    #capStd: 32
    #iterations: 3
    size: 1, 1
    distanceConfig: !type:DunGenEuclideanSquaredDistance
      blendWeight: 0.80
    layers:
      - tile: FloorPlanetGrass
        threshold: 0.80
        noise:
          frequency: 0.05
          noiseType: OpenSimplex2
          fractalType: FBm
          octaves: 2
          lacunarity: 2
      - tile: FloorAsteroidSand
        threshold: 0.60
        noise:
          frequency: 0.05
          noiseType: OpenSimplex2
          fractalType: FBm
          octaves: 3
          lacunarity: 2
      - tile: Lattice
        threshold: 0.50
        noise:
          frequency: 0.065
          noiseType: OpenSimplex2
          fractalType: FBm
          octaves: 2
          lacunarity: 2
  - !type:BiomeDunGen
    biomeTemplate: OmniGrass
  - !type:BiomeDunGen
    biomeTemplate: OmniCaves

# ============================================================================

  # Caves
- type: biomeTemplate
  id: OmniCaves
  layers:
    - !type:BiomeEntityLayer
      threshold: 0.85
      noise:
        seed: 2
        noiseType: OpenSimplex2
        fractalType: PingPong
      allowedTiles:
        - FloorAsteroidSand
      entities:
        - CrystalGreen
        - CrystalPink
        - CrystalOrange
        - CrystalBlack
        - CrystalBlue
        - CrystalYellow
        - CrystalCyan
    - !type:BiomeEntityLayer
      threshold: 0.95
      noise:
        seed: 1
        noiseType: OpenSimplex2
        frequency: 1
      allowedTiles:
      - FloorAsteroidSand
      entities:
      - FloraStalagmite
    - !type:BiomeEntityLayer
      threshold: -0.7
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.1
        gain: 0.5
      allowedTiles:
        - FloorAsteroidSand
      entities:
        - WallRock
    - !type:BiomeDummyLayer
      id: Loot

  # Caves
- type: biomeTemplate
  id: OmniGrass
  layers:
    - !type:BiomeEntityLayer
      threshold: 0.85
      noise:
        seed: 2
        noiseType: OpenSimplex2
        fractalType: PingPong
      allowedTiles:
        - FloorPlanetGrass
      entities:
        - CrystalGreen
        - CrystalCyan
    - !type:BiomeEntityLayer
      threshold: 0.95
      noise:
        seed: 1
        noiseType: OpenSimplex2
        frequency: 1
      allowedTiles:
      - FloorPlanetGrass
      entities:
      - FloraStalagmite
    - !type:BiomeEntityLayer
      threshold: -0.4
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.1
        gain: 0.5
      allowedTiles:
        - FloorPlanetGrass
      entities:
        - WallRock
    - !type:BiomeDummyLayer
      id: Loot
    - !type:BiomeDecalLayer
      allowedTiles:
        - FloorPlanetGrass
      divisions: 2
      threshold: -0.50
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 1
      decals:
        - BushDOne
        - BushDTwo
        - BushDThree
    - !type:BiomeDecalLayer
      allowedTiles:
        - FloorPlanetGrass
      noise:
        seed: 0
        noiseType: OpenSimplex2
        frequency: 1
      divisions: 1
      threshold: 0.8
      decals:
        - FlowersBROne
        - FlowersBRTwo
        - FlowersBRThree

# ============================================================================
